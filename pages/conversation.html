<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- Informations générales de la page -->
  <meta charset="UTF-8">

  <!-- Adaptation de la page aux différentes tailles d'écran -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Titre de la page -->
  <title>MonChat - Contact</title>

  <!-- Lien vers le fichier CSS principal -->
  <link rel="stylesheet" href="../css/base.css">
</head>

<body>

  <!-- En-tête de la page -->
  <header>

    <!-- Nom de l'application -->
    <h1>MonChat</h1>

    <!-- Menu de navigation -->
    <nav>
      <!-- Lien pour retourner à la conversation -->
      <a href="conversation.html">Retour à la conversation</a>
    </nav>

  </header>

  <!-- Contenu principal de la page -->
  <main>

    <!-- Formulaire permettant aux utilisateurs de contacter l'équipe -->
    <form action="conversation.html" method="post">

      <!-- Titre du formulaire -->
      <h2>Nous contacter</h2>

      <!-- Texte explicatif du formulaire -->
      <p>Une question ou un problème? Ecrivez-nous.</p>

      <!-- Champ pour saisir le nom -->
      <p>
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>
      </p>

      <!-- Champ pour saisir l'adresse courriel -->
      <p>
        <label for="courriel">Adresse courriel</label>
        <input type="email" id="courriel" name="courriel" required>
      </p>

      <!-- Menu déroulant pour choisir le sujet du message -->
      <p>
        <label for="sujet">Sujet</label>
        <select id="sujet" name="sujet" required>

          <!-- Choix proposés à l'utilisateur -->
          <option value="">-- Choisissez un sujet --</option>
          <option value="question">Une question</option>
          <option value="traduction">Un problème de traduction</option>
          <option value="technique">Un problème technique</option>
          <option value="suggestion">Une suggestion</option>

        </select>
      </p>

      <!-- Zone permettant de rédiger le message -->
      <p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </p>

      <!-- Bouton pour envoyer le formulaire -->
      <p>
        <button type="submit">Envoyer</button>
      </p>

    </form>

  </main>

  <!-- Pied de page -->
  <footer>

    <!-- Information concernant le service de traduction utilisé -->
    <p>Messages traduits automatiquement avec LibreTranslate, un logiciel libre.</p>

    <!-- Copyright et nom du projet -->
    <p>&copy; 2026 MonChat - Projet fil-rouge</p>

  </footer>

</body>
</html>
