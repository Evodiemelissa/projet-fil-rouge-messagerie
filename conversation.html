<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonChat - Conversation</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="conversation.css">
</head>

<body class="page-conversation">

  <div class="container">

    <aside id="liste-conversations">

      <header class="entete-liste">
        <h1>MonChat</h1>
        <div class="icones">
          <button type="button" id="btn-ajouter-contact" title="Ajouter un contact">
            <i class="fa-solid fa-user-plus"></i>
          </button>
          <a href="parametre.html" title="Paramètres"><i class="fa-solid fa-gear"></i></a>
        </div>
      </header>

      <div class="recherche">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="recherche" placeholder="Rechercher une conversation">
      </div>

      <section>
        <h2 class="cache">Conversations</h2>
        <ul id="liste-contacts"></ul>
      </section>

      <nav>
        <a href="parametre.html"><i class="fa-solid fa-gear"></i> Paramètres</a>
        <a href="contact.html"><i class="fa-solid fa-address-book"></i> Contact</a>
        <a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</a>
      </nav>
    </aside>

    <main id="conversation-ouverte">

      <header class="entete-conversation">
        <div class="avatar" id="avatar-contact">?</div>
        <div class="infos">
          <h2 id="nom-contact">MonChat</h2>
          <p><small id="info-contact"></small></p>
        </div>
        <div class="icones">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
      </header>

      <section id="messages"></section>

      <footer>
        <form id="formulaire-envoi" action="conversation.html" method="post">

          <label for="langue-envoi" class="cache">Traduire mon message en</label>
          <select id="langue-envoi" name="langue-envoi" title="Traduire mon message en">
            <option value="en" selected>EN Anglais</option>
            <option value="fr">FR Français</option>
            <option value="es">ES Espagnol</option>
            <option value="de">DE Allemand</option>
            <option value="it">IT Italien</option>
          </select>

          <label for="texte" class="cache">Votre message</label>
          <input type="text" id="texte" name="texte" placeholder="Écrivez un message" required>

          <button type="submit" aria-label="Envoyer">
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </form>
      </footer>

    </main>
  </div>

  <script src="conversation.js"></script>
</body>

</html>
