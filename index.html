<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mamessagerie - Connexion</title>
</head>
<body>

  <header>
    <h1> Bienvenue dans ma messagerie</h1>
    <p>Discutez simplement avec vos proches.</p>
  </header>

  <main>
    <form action="conversation.html" method="get">
      <h2>Connexion</h2>

      <label for="courriel">Adresse courriel</label>
      <input type="email" id="courriel" name="courriel"
             placeholder="exemple@courriel.com" required>

      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" name="mdp" required>

      <label>
        <input type="checkbox" name="souvenir">
        Se souvenir de moi
      </label>

      <button type="submit">Se connecter</button>
      <a href="inscription.html">S'inscrire</a>
      <a href="mot-de-passe-oublie.html">Mot de passe oublie ?</a>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Ma messagerie.Tous droits reserves - Projet fil-rouge</p>
    <a href="#contact">Contact</a>
  </footer>

</body>
</html>
