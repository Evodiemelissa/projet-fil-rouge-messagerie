<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonChat - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>MonChat</h1>
  </header>

  <main>
    <form action="conversation.html" method="get">
      <h2>Creer un compte</h2>

      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="nom" required>

      <label for="courriel">Adresse courriel</label>
      <input type="email" id="courriel" name="courriel" required>

      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" name="mdp" required>

      <label for="mdp-confirm">Confirmer le mot de passe</label>
      <input type="password" id="mdp-confirm" name="mdp-confirm" required>

      <button type="submit">S'inscrire</button>
      <a href="index.html">Dejaun compte ? Se connecter</a>
    </form>
  </main>

</body>
</html>
