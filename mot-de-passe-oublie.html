<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonChat - Mot de passe oublié</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>MonChat</h1>
  </header>

  <main>
    <form action="index.html" method="post">
      <h2>Mot de passe oublié</h2>
      <p>Entrez votre adresse courriel pour recevoir un lien de réinitialisation.</p>

      <p>
        <label for="courriel">Adresse courriel</label>
        <input type="email" id="courriel" name="courriel" required>
      </p>

      <p>
        <button type="submit">Envoyer le lien</button>
      </p>
    </form>

    <nav>
      <a href="index.html">Retour à la connexion</a>
    </nav>
  </main>
  <footer>
    <p>Messages traduits automatiquement avec LibreTranslate, un logiciel libre.</p>
    <p>&copy; 2026 MonChat - Projet fil-rouge</p>
    <a href="contact.html">Contact</a>
  </footer>
</body>

</html>
